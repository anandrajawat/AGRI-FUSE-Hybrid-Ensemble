[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-fuse"
version = "2.1.0"
description = "AGRI-FUSE Hybrid Ensemble (AF-HE): Availability-Aware Gated Multimodal Architecture with Adaptive Tree-Based Ensemble Learning for Agricultural Intelligence and Crop Yield Prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AGRI-FUSE Research Team", email = "research@agri-fuse.org"}
]
keywords = [
    "deep-learning",
    "multimodal-learning",
    "gated-fusion",
    "ensemble-learning",
    "stacking",
    "agriculture",
    "smart-farming",
    "crop-recommendation",
    "crop-yield-prediction",
    "explainable-ai",
    "conformal-prediction"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "shap>=0.42.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
    "reportlab>=4.0.0",
    "joblib>=1.3.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.9.0"
]

[project.urls]
"Homepage" = "https://github.com/rupesh/agri-fuse"
"Documentation" = "https://github.com/rupesh/agri-fuse#readme"
"Bug Tracker" = "https://github.com/rupesh/agri-fuse/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

