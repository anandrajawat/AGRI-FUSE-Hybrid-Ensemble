version: '3.8'

services:
  agri-fuse:
    build:
      context: .
      dockerfile: Dockerfile
    image: agri-fuse:latest
    container_name: agri_fuse_platform
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
